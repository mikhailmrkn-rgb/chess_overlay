name: Test and build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # lets a version tag publish a release with the .exe

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test tools
        run: |
          sudo apt-get install -y fonts-dejavu-core || (sudo apt-get update && sudo apt-get install -y fonts-dejavu-core)
          pip install numpy pillow pytest
      - name: Run tests
        run: pytest -q tests

  exe:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build Chess Overlay.exe
        run: python build_exe.py
      - uses: actions/upload-artifact@v4
        with:
          name: Chess-Overlay-exe
          path: Chess Overlay.exe
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Chess Overlay.exe
          generate_release_notes: true
